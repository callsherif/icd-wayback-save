name: wayback-save
on:
  workflow_dispatch:
    inputs:
      urls:
        description: "Public URLs to archive, separated by spaces"
        required: true
jobs:
  save:
    runs-on: ubuntu-latest
    steps:
      - name: Save Page Now, then follow each capture job to its result
        shell: bash
        run: |
          set +e
          declare -A JOB
          for u in ${{ github.event.inputs.urls }}; do
            body=$(curl -s -m 120 -A 'Mozilla/5.0 (X11; Linux x86_64)' -w '\nHTTP %{http_code}' -X POST "https://web.archive.org/save/$u")
            code=$(printf '%s' "$body" | tail -1)
            job=$(printf '%s' "$body" | grep -oE 'spn\.watchJob\("[^"]+"' | head -1 | cut -d'"' -f2)
            echo "SAVE $u $code job=${job:-none}"
            echo "BODY $u $(printf '%s' "$body" | sed -E 's/<[^>]+>/ /g' | tr -s ' \n' ' ' | head -c 500)"
            [ -n "$job" ] && JOB[$u]=$job
            sleep 15
          done
          for i in $(seq 1 16); do
            sleep 15; left=0
            for u in "${!JOB[@]}"; do
              st=$(curl -s -m 30 "https://web.archive.org/save/status/${JOB[$u]}")
              s=$(printf '%s' "$st" | python3 -c "import sys,json; d=json.load(sys.stdin); print(d.get('status'), d.get('timestamp',''), d.get('status_ext',''), (d.get('message') or '')[:120])" 2>/dev/null || echo unparsable)
              echo "STATUS $u $s"; case "$s" in pending*) left=$((left+1));; esac
            done
            [ $left -eq 0 ] && break
          done
          for u in ${{ github.event.inputs.urls }}; do
            echo "CDX $u $(curl -s -m 30 "https://web.archive.org/cdx/search/cdx?url=$u&from=20261027&fl=timestamp,statuscode&limit=5" | tr '\n' ' ')"
            echo "AVAIL $u $(curl -s -m 30 "https://archive.org/wayback/available?url=$u&timestamp=20261028" | grep -oE '"timestamp": ?"[0-9]{14}"|archived_snapshots": ?\{\}' | head -1)"
          done
