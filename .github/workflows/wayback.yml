name: wayback-save
on:
  workflow_dispatch:
    inputs:
      urls:
        description: "Public URLs to archive, separated by spaces"
        required: true
jobs:
  save:
    runs-on: ubuntu-latest
    steps:
      - name: Save Page Now (GET the save address and follow it to the new snapshot), then confirm in the index
        shell: bash
        run: |
          set +e
          UA='Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/130.0 Safari/537.36'
          for u in ${{ github.event.inputs.urls }}; do
            for try in 1 2 3; do
              final=$(curl -s -L -m 180 -A "$UA" -o /dev/null -w '%{http_code} %{url_effective}' "https://web.archive.org/save/$u")
              echo "SAVE $u try$try $final"
              case "$final" in "200 https://web.archive.org/web/"*) break;; esac
              sleep 60
            done
            sleep 10
          done
          sleep 60
          for u in ${{ github.event.inputs.urls }}; do
            echo "AVAIL $u $(curl -s -m 30 "https://archive.org/wayback/available?url=$u&timestamp=20261028" | grep -oE '"timestamp": ?"[0-9]{14}"|archived_snapshots": ?\{\}' | head -1)"
          done
