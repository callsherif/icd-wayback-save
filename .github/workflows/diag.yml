name: wayback-diag
on:
  workflow_dispatch:
    inputs:
      url:
        required: true
jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - shell: bash
        run: |
          set +e
          u="${{ github.event.inputs.url }}"
          UA='Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/130.0 Safari/537.36'
          try() { echo "=== $1"; shift; curl -s -m 120 -A "$UA" -w '\nHTTP %{http_code}\n' "$@" | sed -E 's/<[^>]+>/ /g' | tr -s ' \n' ' ' | tail -c 400; echo; }
          try "A: POST /save/<url> json+form"  -H 'Accept: application/json' -H "Referer: https://web.archive.org/save/$u" -X POST "https://web.archive.org/save/$u" --data-urlencode "url=$u" --data-urlencode "capture_all=on"
          try "B: POST /save/<url> xhr"        -H 'Accept: application/json' -H 'X-Requested-With: XMLHttpRequest' -H "Referer: https://web.archive.org/save/$u" -X POST "https://web.archive.org/save/$u" --data-urlencode "url=$u"
          try "C: GET /save/<url> follow"      -L -o /dev/null -w 'final=%{url_effective} ' "https://web.archive.org/save/$u"
          try "D: POST /save/ form html"       -H 'Accept: text/html' -H 'Referer: https://web.archive.org/save/' -X POST "https://web.archive.org/save/" --data-urlencode "url=$u" --data-urlencode "capture_all=on"
          try "E: SPN2 api anon"               -H 'Accept: application/json' -X POST "https://web.archive.org/save" --data-urlencode "url=$u"
          echo "=== availability after 60 s"; sleep 60; curl -s -m 30 "https://archive.org/wayback/available?url=$u&timestamp=20261028"; echo
